; H2S-Dev (ESP32 + SX1276) - Meshtastic variant
; Lives in hobbyiot/LoRa-Nodes (Meshtastic/variant/h2s_dev) and is linked into meshtastic/firmware at
; variants/esp32/h2s_dev by Meshtastic/link_variant.sh.

[env:h2s-dev]
; metadata block in the format current upstream variants use
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = H2S-Dev
custom_meshtastic_tags = hobbyiot

extends = esp32_base
board = h2s_dev               ; -> boards/h2s_dev.json (ESP32-WROOM, 4 MB flash)
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -D VTABLES_IN_FLASH=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -O2
  -I variants/esp32/h2s_dev   ; must match where link_variant.sh puts the folder
board_build.f_cpu = 240000000L
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
upload_speed = 460800
lib_deps =
  ${esp32_base.lib_deps}
